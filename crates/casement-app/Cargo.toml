[package]
name = "casement"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-channel = "2.5.0"
glib = "0.21.5"
gst-plugin-gtk4 = "0.14.5"
gstreamer = "0.24.5"
gstreamer-app = "0.24.5"
gtk = { package = "gtk4", version = "0.10.3", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_6"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "net"] }
casement-net = { version = "0.1.0", path = "../casement-net" }
casement-media = { version = "0.1.0", path = "../casement-media" }
casement-proto = { version = "0.1.0", path = "../casement-proto" }

[dev-dependencies]
tempfile = "3"
