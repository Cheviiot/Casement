[package]
name = "casement-net"
description = "Casement networking: device identity, transport and discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.5"
casement-proto = { version = "0.1.2", path = "../casement-proto" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
libc = "0.2.191"
mdns-sd = { version = "0.21.6", features = ["async"] }
opaque-ke = { version = "4.0.1", features = ["argon2"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = "0.14.7"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
sha2 = "0.10"
socket2 = "0.6.5"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "macros", "io-util", "fs"] }
tracing = "0.1.44"
x509-parser = "0.18.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
