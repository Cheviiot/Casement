name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Packages
        run: >
          dnf -y install git gcc pkgconf-pkg-config binutils tar gzip
          gtk4-devel libadwaita-devel gstreamer1-devel gstreamer1-plugins-base-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release --workspace
      - name: Archive
        run: scripts/package-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            target/release/casement
            target/release/casement-host
            target/release/casement-cli

  # Distribution packages of the same binaries, each made on its own distribution so the
  # dependencies come out right.
  package:
    name: ${{ matrix.name }}
    needs: linux
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built with Debian's rpmbuild: ALT's own mirrors are very slow from abroad.
          - name: ALT p11
            image: docker.io/library/debian:13
            script: packaging/alt/build.sh
            artifact: alt
            files: dist/*.rpm
          - name: Fedora
            image: registry.fedoraproject.org/fedora:44
            script: packaging/fedora/build.sh
            artifact: fedora
            files: dist/*.rpm
          - name: Debian
            image: docker.io/library/debian:13
            script: packaging/debian/build.sh
            artifact: debian
            files: dist/*.deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: target/release
      - name: Package
        env:
          REL: ${{ !startsWith(github.ref, 'refs/tags/v') && format('0.{0}', github.run_number) || '' }}
        run: |
          chmod +x target/release/*
          # A tagged build is release 1 (alt1 on ALT); others sort before it.
          if [ -n "$REL" ]; then
            case "${{ matrix.artifact }}" in alt) export REL="alt$REL" ;; esac
          else
            unset REL
          fi
          sh ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}

  windows:
    name: Windows
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    env:
      MINGW_ADWAITA: /opt/mingw-libadwaita
    steps:
      - name: Packages
        run: >
          dnf -y install git gcc pkgconf-pkg-config curl zip xz tar glib2-devel
          sassc meson ninja-build mingw32-nsis mingw64-gcc mingw64-gtk4
          mingw64-appstream mingw64-fribidi mingw64-hicolor-icon-theme mingw64-opus
          mingw64-pkg-config mingw64-gstreamer1-plugins-base
          mingw64-gstreamer1-plugins-good mingw64-gstreamer1-plugins-bad-free
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - name: Libadwaita cache
        id: adwaita
        uses: actions/cache@v4
        with:
          path: /opt/mingw-libadwaita
          key: mingw-libadwaita-${{ hashFiles('scripts/build-libadwaita-mingw') }}
      - name: Libadwaita for mingw
        if: steps.adwaita.outputs.cache-hit != 'true'
        run: scripts/build-libadwaita-mingw "$MINGW_ADWAITA"
      - name: Installer and portable archive
        run: scripts/package-windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: casement-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.cheviiot.Casement.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: casement-x86_64.flatpak

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, package, windows, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version
        run: |
          version=$(scripts/version)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "{linux,alt,fedora,debian,windows,flatpak}"
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(scripts/version)
          mkdir dist
          cp artifacts/* dist/
          mv dist/casement-x86_64.flatpak "dist/casement-$version-x86_64.flatpak"
          # Stable names for the "latest" download links.
          cp dist/casement-*-linux-x86_64.tar.gz dist/casement-linux-x86_64.tar.gz
          cp dist/casement-*-windows-x86_64-setup.exe dist/casement-windows-x86_64-setup.exe
          cp packaging/linux/install.sh dist/
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Casement $version" --notes-file - <<'NOTES'
          | Система | Файл |
          |---|---|
          | Windows 10 и 11 | `casement-*-windows-x86_64-setup.exe` (мастер установки) или `-portable.zip` |
          | ALT p11 | `casement-*-alt1.x86_64.rpm` |
          | Fedora | `casement-*.fc44.x86_64.rpm` |
          | Debian 13, Ubuntu 25.04+ | `casement_*_amd64.deb` |
          | Любой Linux | `casement-*-x86_64.flatpak` или `install.sh` |

          Подробности — в [README](https://github.com/Cheviiot/Casement#установка).
          NOTES
